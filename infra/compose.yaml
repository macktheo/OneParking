services:
  mysql:
    image: mysql:8.4.7
    command: ["--log-bin-trust-function-creators=1", "--innodb-buffer-pool-size=256M", "--max-connections=80", "--thread-cache-size=16"]
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    ports: ["127.0.0.1:13307:3306"]
    environment:
      MYSQL_DATABASE: oneparking
      MYSQL_USER: oneparking
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql", "./mysql-init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      retries: 20
  phpmyadmin:
    image: phpmyadmin:5.2.3
    mem_limit: 256m
    restart: unless-stopped
    ports: ["127.0.0.1:8086:80"]
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 16M
    depends_on:
      mysql:
        condition: service_healthy
  app:
    build:
      context: ../backend
      dockerfile: ../infra/php/Dockerfile
    image: oneparking-app:local
    ports: ["127.0.0.1:8000:80"]
    env_file: ../backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      LOG_CHANNEL: stderr
      APP_TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12
    volumes: ["app-storage:/var/www/html/storage"]
    mem_limit: 512m
    cpus: 2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  mysql-data:
  app-storage:
